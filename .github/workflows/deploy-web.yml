name: Deploy Robaudit web to Azure Static Web Apps

on:
  workflow_dispatch:
  push:
    branches: [main, summo]
    paths:
      - 'apps/landing/**'
      - 'packages/bindings/**'
      - 'convex/_generated/**'
      - '.github/workflows/deploy-web.yml'

env:
  VITE_CONVEX_URL: https://hushed-shrimp-24.convex.cloud
  VITE_STDB_URI: wss://maincloud.spacetimedb.com
  VITE_STDB_DB: keel

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @keel/web build
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: apps/landing/dist
          skip_app_build: true
          output_location: ''
