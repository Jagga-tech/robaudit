name: Build Summo agent image

on:
  workflow_dispatch:
  push:
    branches: [main, summo]
    paths:
      - 'apps/agent/**'
      - 'packages/**'
      - 'convex/_generated/**'
      - 'demo/seed.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/build-agent-image.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/agent/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/keel-agent:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/keel-agent:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
