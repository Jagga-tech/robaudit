# Summo -> Jira mirror. One web trigger; the bridge (apps/jira-bridge) POSTs ledger changes here.
modules:
  webtrigger:
    - key: summo-event
      function: main
  function:
    - key: main
      handler: index.handler
app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/97774260-f991-4a12-b4ca-2c0835e67c16
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - storage:app
    - read:issue:jira
    - write:issue:jira
    - read:comment:jira
    - write:comment:jira
    - read:project:jira
    - read:issue-type:jira
    - read:issue-status:jira
    - read:issue.transition:jira
    - read:label:jira
