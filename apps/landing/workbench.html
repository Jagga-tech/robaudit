<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robaudit workbench</title>
<meta name="description" content="The live Robaudit workbench: Summo proposes, the controller posts.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Hanken+Grotesk:wght@400;500;600&family=Geist+Mono:wght@500&display=swap">
<link rel="stylesheet" href="/src/base.css">
<link rel="stylesheet" href="/src/workbench.css">
</head>
<body>
<aside class="sidebar">
  <a class="wordmark" href="/workbench"><img class="brand-logo" src="/Gemini_Generated_Image_q3nderq3nderq3nd%20Background%20Removed.png" alt=""><span class="brand-name">Robaudit</span></a>
  <nav id="nav" aria-label="Workbench"></nav>
  <div class="sfoot">
    <span class="badge" id="badge"><i class="avatar" id="avatar" aria-hidden="true"></i><span><span id="badgeText">Summo · watching</span><small id="badgeDetail"></small></span></span>
    <p class="presence" id="presence"></p>
    <p class="me"><i class="dot" id="liveDot" hidden></i>Dana · Controller</p>
    <button class="pill outline sm" id="resetBtn" type="button">Reset demo</button>
  </div>
</aside>

<main class="col">
  <header class="ph">
    <div><h1 id="ptitle"></h1><p class="sub" id="psub"></p></div>
    <div class="pacts" id="pacts"></div>
  </header>
  <div id="page"></div>
</main>

<div class="sheet" id="sheet" role="dialog" aria-labelledby="sheetTitle" hidden>
  <button class="close" id="sheetClose" type="button" aria-label="Close">×</button>
  <h3 id="sheetTitle"></h3>
  <div id="sheetBody"></div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script type="module" src="/src/shell.ts"></script>
</body>
</html>
